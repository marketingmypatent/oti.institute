document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

    window.addEventListener('message', function (e) {

      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.

            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nsition:max-height .55s cubic-bezier(.22,.7,.3,1),opacity .4s ease;max-height:{{ p1h }};opacity:{{ p1o }}\">\n<div style=\"padding-top:clamp(12px,1.4vw,18px);padding-left:calc(clamp(46px,5vw,88px) + clamp(14px,3vw,44px));display:grid;gap:11px;max-width:78ch\">\n<p style=\"margin:0;font-size:15px;line-height:1.62;color:#3A3F44\">Curricula are designed starting with the patient outcomes in mind. We identify the knowledge, skills, and attitudes that lead to those outcomes, and build instruction backwards from there.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div sc-camel-on-mouse-enter=\"{{ pOn2 }}\" sc-camel-on-mouse-leave=\"{{ pOff }}\" sc-camel-on-click=\"{{ pTog2 }}\" style=\"border-top:1px solid #DDDFE0;padding:clamp(20px,2.4vw,30px) clamp(0px,1.5vw,18px);cursor:pointer;transition:background .4s\" style-hover=\"background:#F7F7F7\">\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(14px,3vw,44px);align-items:baseline\">\n<div style=\"flex:none;width:clamp(46px,5vw,88px);font-weight:200;font-size:clamp(30px,4vw,54px);line-height:.85;color:#C4C7C9\">02<\u002Fdiv>\n<h4 style=\"flex:1 1 200px;margin:0;font-weight:400;font-size:clamp(19px,2.2vw,25px);line-height:1.2;letter-spacing:-.018em\">Curricula are evidence-driven<\u002Fh4>\n<\u002Fdiv>\n<div style=\"overflow:hidden;transition:max-height .55s cubic-bezier(.22,.7,.3,1),opacity .4s ease;max-height:{{ p2h }};opacity:{{ p2o }}\">\n<div style=\"padding-top:clamp(12px,1.4vw,18px);padding-left:calc(clamp(46px,5vw,88px) + clamp(14px,3vw,44px));display:grid;gap:11px;max-width:78ch\">\n<p style=\"margin:0;font-size:15px;line-height:1.62;color:#3A3F44\">Content reflects current scientific evidence on the causes, prevention, and treatment of biological complications around artificial dental restorations. It is reviewed and updated on a defined cycle.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div sc-camel-on-mouse-enter=\"{{ pOn3 }}\" sc-camel-on-mouse-leave=\"{{ pOff }}\" sc-camel-on-click=\"{{ pTog3 }}\" style=\"border-top:1px solid #DDDFE0;padding:clamp(20px,2.4vw,30px) clamp(0px,1.5vw,18px);cursor:pointer;transition:background .4s\" style-hover=\"background:#F7F7F7\">\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(14px,3vw,44px);align-items:baseline\">\n<div style=\"flex:none;width:clamp(46px,5vw,88px);font-weight:200;font-size:clamp(30px,4vw,54px);line-height:.85;color:#C4C7C9\">03<\u002Fdiv>\n<h4 style=\"flex:1 1 200px;margin:0;font-weight:400;font-size:clamp(19px,2.2vw,25px);line-height:1.2;letter-spacing:-.018em\">Faculty are practitioners<\u002Fh4>\n<\u002Fdiv>\n<div style=\"overflow:hidden;transition:max-height .55s cubic-bezier(.22,.7,.3,1),opacity .4s ease;max-height:{{ p3h }};opacity:{{ p3o }}\">\n<div style=\"padding-top:clamp(12px,1.4vw,18px);padding-left:calc(clamp(46px,5vw,88px) + clamp(14px,3vw,44px));display:grid;gap:11px;max-width:78ch\">\n<p style=\"margin:0;font-size:15px;line-height:1.62;color:#3A3F44\">Teaching is delivered by specialists who are active in clinical practice and research. Academic authority alone is not sufficient qualification to lead clinical training.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div sc-camel-on-mouse-enter=\"{{ pOn4 }}\" sc-camel-on-mouse-leave=\"{{ pOff }}\" sc-camel-on-click=\"{{ pTog4 }}\" style=\"border-top:1px solid #DDDFE0;padding:clamp(20px,2.4vw,30px) clamp(0px,1.5vw,18px);cursor:pointer;transition:background .4s\" style-hover=\"background:#F7F7F7\">\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(14px,3vw,44px);align-items:baseline\">\n<div style=\"flex:none;width:clamp(46px,5vw,88px);font-weight:200;font-size:clamp(30px,4vw,54px);line-height:.85;color:#C4C7C9\">04<\u002Fdiv>\n<h4 style=\"flex:1 1 200px;margin:0;font-weight:400;font-size:clamp(19px,2.2vw,25px);line-height:1.2;letter-spacing:-.018em\">Outcomes are measured<\u002Fh4>\n<\u002Fdiv>\n<div style=\"overflow:hidden;transition:max-height .55s cubic-bezier(.22,.7,.3,1),opacity .4s ease;max-height:{{ p4h }};opacity:{{ p4o }}\">\n<div style=\"padding-top:clamp(12px,1.4vw,18px);padding-left:calc(clamp(46px,5vw,88px) + clamp(14px,3vw,44px));display:grid;gap:11px;max-width:78ch\">\n<p style=\"margin:0;font-size:15px;line-height:1.62;color:#3A3F44\">We track what happens to patients treated by our learners. This data informs program development and improvement \u2014 not just at graduation, but for years after.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div sc-camel-on-mouse-enter=\"{{ pOn5 }}\" sc-camel-on-mouse-leave=\"{{ pOff }}\" sc-camel-on-click=\"{{ pTog5 }}\" style=\"border-top:1px solid #DDDFE0;border-bottom:1px solid #DDDFE0;padding:clamp(20px,2.4vw,30px) clamp(0px,1.5vw,18px);cursor:pointer;transition:background .4s\" style-hover=\"background:#F7F7F7\">\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(14px,3vw,44px);align-items:baseline\">\n<div style=\"flex:none;width:clamp(46px,5vw,88px);font-weight:200;font-size:clamp(30px,4vw,54px);line-height:.85;color:#C4C7C9\">05<\u002Fdiv>\n<h4 style=\"flex:1 1 200px;margin:0;font-weight:400;font-size:clamp(19px,2.2vw,25px);line-height:1.2;letter-spacing:-.018em\">Assessment is demonstration of competency<\u002Fh4>\n<\u002Fdiv>\n<div style=\"overflow:hidden;transition:max-height .55s cubic-bezier(.22,.7,.3,1),opacity .4s ease;max-height:{{ p5h }};opacity:{{ p5o }}\">\n<div style=\"padding-top:clamp(12px,1.4vw,18px);padding-left:calc(clamp(46px,5vw,88px) + clamp(14px,3vw,44px));display:grid;gap:11px;max-width:78ch\">\n<p style=\"margin:0;font-size:15px;line-height:1.62;color:#3A3F44\">Assessment is based on demonstrating the desired level of competency in an educational or the clinical setting \u2014 not on time served, hours logged, or examinations alone.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<sc-if value=\"{{ showPrograms }}\" hint-placeholder-val=\"{{ false }}\">\n<section id=\"programs\" data-screen-label=\"Programs\" style=\"padding:clamp(64px,8vw,104px) clamp(20px,4vw,56px)\">\n<div style=\"max-width:1320px;margin:0 auto\">\n<div style=\"display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between;margin-bottom:clamp(28px,3.4vw,42px)\">\n<div>\n<div style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#5E8B8B;margin-bottom:16px\">{{ numPrograms }} &nbsp;Education &nbsp;\u00b7&nbsp; Programs<\u002Fdiv>\n<h3 style=\"margin:0;font-weight:300;font-size:clamp(28px,4vw,48px);line-height:1.1;letter-spacing:-.028em;max-width:18ch;text-wrap:pretty\">Upcoming programs, modules and clinical workshops.<\u002Fh3>\n<\u002Fdiv>\n<div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n<button type=\"button\" sc-camel-on-click=\"{{ filterAll }}\" style=\"border:1px solid {{ chipAllBorder }};background:{{ chipAllBg }};color:{{ chipAllFg }};border-radius:999px;padding:10px 20px;font-size:14px;cursor:pointer;transition:all .3s\">All<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ filterModules }}\" style=\"border:1px solid {{ chipModBorder }};background:{{ chipModBg }};color:{{ chipModFg }};border-radius:999px;padding:10px 20px;font-size:14px;cursor:pointer;transition:all .3s\">Modules<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ filterWorkshops }}\" style=\"border:1px solid {{ chipWsBorder }};background:{{ chipWsBg }};color:{{ chipWsFg }};border-radius:999px;padding:10px 20px;font-size:14px;cursor:pointer;transition:all .3s\">Workshops<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;align-items:start\">\n<div style=\"border:1px solid #DDDFE0;border-radius:20px;padding:clamp(20px,2.4vw,30px)\">\n<div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:22px\">\n<span style=\"font-weight:400;font-size:22px;letter-spacing:-.02em\">{{ calMonth }}<\u002Fspan>\n<span style=\"font:500 12px/1 'IBM Plex Mono',monospace;color:#6E7479\">{{ calYear }}<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#9AA0A4;margin-bottom:8px\">\n<div style=\"text-align:center;padding:6px 0\">Mon<\u002Fdiv><div style=\"text-align:center;padding:6px 0\">Tue<\u002Fdiv><div style=\"text-align:center;padding:6px 0\">Wed<\u002Fdiv><div style=\"text-align:center;padding:6px 0\">Thu<\u002Fdiv><div style=\"text-align:center;padding:6px 0\">Fri<\u002Fdiv><div style=\"text-align:center;padding:6px 0\">Sat<\u002Fdiv><div style=\"text-align:center;padding:6px 0\">Sun<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:4px\">\n<sc-for list=\"{{ days }}\" as=\"day\" hint-placeholder-count=\"30\">\n<div style=\"aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:13.5px;color:#3A3F44;background:#F7F7F7\">{{ day.label }}<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border:1px solid #DDDFE0;border-radius:20px;padding:clamp(20px,2.4vw,30px);min-height:220px;display:flex;flex-direction:column\">\n<div style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#6E7479;padding-bottom:16px;border-bottom:1px solid #DDDFE0\">Selected programs<\u002Fdiv>\n<div style=\"flex:1;display:flex;align-items:center;justify-content:center;padding:36px 0\">\n<span style=\"display:inline-flex;align-items:center;gap:9px;padding:9px 18px;border-radius:999px;background:#DDE7E4;color:#5E8B8B;font-size:14px\"><span style=\"width:7px;height:7px;border-radius:50%;background:#5E8B8B;animation:pulse 2.6s ease-in-out infinite\"><\u002Fspan>in preparation<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ showPrograms }}\" hint-placeholder-val=\"{{ false }}\">\n<section id=\"registration\" data-screen-label=\"Registration\" style=\"background:#F7F7F7;padding:clamp(64px,8vw,104px) clamp(20px,4vw,56px)\">\n<div style=\"max-width:1320px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(28px,4vw,64px);align-items:start\">\n<div style=\"position:{{ stickyPos }};top:96px\">\n<div style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#5E8B8B;margin-bottom:16px\">{{ numRegistration }} &nbsp;Education &nbsp;\u00b7&nbsp; Registration<\u002Fdiv>\n<h3 style=\"margin:0;font-weight:300;font-size:clamp(28px,4vw,48px);line-height:1.1;letter-spacing:-.028em\">Begin your registration.<\u002Fh3>\n<p style=\"margin:22px 0 0;font-size:16px;line-height:1.65;color:#3A3F44;max-width:46ch\">Registration is open to licensed dental practitioners with a minimum of three years of clinical experience. Submit the form below; our admissions office will respond within ten working days.<\u002Fp>\n<div style=\"margin-top:26px;display:inline-flex;align-items:center;gap:9px;padding:8px 16px;border-radius:999px;background:#DDE7E4;color:#5E8B8B;font-size:13.5px\">Response within 10 working days.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid #DDDFE0;border-radius:22px;padding:clamp(22px,2.6vw,34px);display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px\">\n<label style=\"display:block\"><span style=\"display:block;font-size:12.5px;color:#6E7479;margin-bottom:6px\">First name<\u002Fspan><input type=\"text\" style=\"width:100%;padding:12px 14px;border:1px solid #C4C7C9;border-radius:10px;background:#F7F7F7;outline:none;transition:border-color .25s\" style-focus=\"border-color:#5E8B8B\"><\u002Flabel>\n<label style=\"display:block\"><span style=\"display:block;font-size:12.5px;color:#6E7479;margin-bottom:6px\">Last name<\u002Fspan><input type=\"text\" style=\"width:100%;padding:12px 14px;border:1px solid #C4C7C9;border-radius:10px;background:#F7F7F7;outline:none;transition:border-color .25s\" style-focus=\"border-color:#5E8B8B\"><\u002Flabel>\n<label style=\"display:block\"><span style=\"display:block;font-size:12.5px;color:#6E7479;margin-bottom:6px\">Email<\u002Fspan><input type=\"email\" style=\"width:100%;padding:12px 14px;border:1px solid #C4C7C9;border-radius:10px;background:#F7F7F7;outline:none;transition:border-color .25s\" style-focus=\"border-color:#5E8B8B\"><\u002Flabel>\n<label style=\"display:block\"><span style=\"display:block;font-size:12.5px;color:#6E7479;margin-bottom:6px\">Phone<\u002Fspan><input type=\"tel\" style=\"width:100%;padding:12px 14px;border:1px solid #C4C7C9;border-radius:10px;background:#F7F7F7;outline:none;transition:border-color .25s\" style-focus=\"border-color:#5E8B8B\"><\u002Flabel>\n<label style=\"display:block\"><span style=\"display:block;font-size:12.5px;color:#6E7479;margin-bottom:6px\">Country of practice<\u002Fspan><sc-raw-select style=\"width:100%;padding:12px 14px;border:1px solid #C4C7C9;border-radius:10px;background:#F7F7F7;outline:none\"><option>Select country\u2026<\u002Foption><option>Switzerland<\u002Foption><option>Germany<\u002Foption><option>Austria<\u002Foption><option>Belgium<\u002Foption><option>France<\u002Foption><option>Portugal<\u002Foption><option>Italy<\u002Foption><option>United Kingdom<\u002Foption><option>Other<\u002Foption><\u002Fsc-raw-select><\u002Flabel>\n<label style=\"display:block\"><span style=\"display:block;font-size:12.5px;color:#6E7479;margin-bottom:6px\">Years in clinical practice<\u002Fspan><sc-raw-select style=\"width:100%;padding:12px 14px;border:1px solid #C4C7C9;border-radius:10px;background:#F7F7F7;outline:none\"><option>Select\u2026<\u002Foption><option>3 \u2013 5 years<\u002Foption><option>6 \u2013 10 years<\u002Foption><option>11 \u2013 20 years<\u002Foption><option>20+ years<\u002Foption><\u002Fsc-raw-select><\u002Flabel>\n<div style=\"grid-column:1/-1\">\n<span style=\"display:block;font-size:12.5px;color:#6E7479;margin-bottom:10px\">Program of interest<\u002Fspan>\n<div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n<label style=\"display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border:1px solid #C4C7C9;border-radius:999px;font-size:14px;cursor:pointer;transition:border-color .25s\" style-hover=\"border-color:#5E8B8B\"><input type=\"radio\" name=\"program\" style=\"accent-color:#5E8B8B\">Foundation<\u002Flabel>\n<label style=\"display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border:1px solid #C4C7C9;border-radius:999px;font-size:14px;cursor:pointer;transition:border-color .25s\" style-hover=\"border-color:#5E8B8B\"><input type=\"radio\" name=\"program\" style=\"accent-color:#5E8B8B\">Advanced<\u002Flabel>\n<label style=\"display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border:1px solid #C4C7C9;border-radius:999px;font-size:14px;cursor:pointer;transition:border-color .25s\" style-hover=\"border-color:#5E8B8B\"><input type=\"radio\" name=\"program\" style=\"accent-color:#5E8B8B\">Master<\u002Flabel>\n<\u002Fdiv>\n<\u002Fdiv>\n<label style=\"display:block;grid-column:1/-1\"><span style=\"display:block;font-size:12.5px;color:#6E7479;margin-bottom:6px\">Motivation<\u002Fspan><textarea rows=\"4\" style=\"width:100%;padding:12px 14px;border:1px solid #C4C7C9;border-radius:10px;background:#F7F7F7;outline:none;resize:vertical;transition:border-color .25s\" style-focus=\"border-color:#5E8B8B\"><\u002Ftextarea><\u002Flabel>\n<label style=\"grid-column:1/-1;display:flex;gap:11px;align-items:flex-start;font-size:13px;line-height:1.55;color:#6E7479\"><input type=\"checkbox\" style=\"margin-top:3px;accent-color:#5E8B8B\">I confirm that the information provided is accurate, and I consent to IOTI processing it for admissions purposes in accordance with Swiss data-protection law.<\u002Flabel>\n<button type=\"button\" sc-camel-on-click=\"{{ doReg }}\" style=\"grid-column:1/-1;background:#5E8B8B;color:#fff;border:0;border-radius:999px;padding:16px;font-size:15px;font-family:inherit;cursor:pointer;transition:background .3s\" style-hover=\"background:#4A7070\">Submit registration \u2192<\u002Fbutton>\n<sc-if value=\"{{ regDone }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"grid-column:1/-1;margin-top:6px;border:1px solid #C7DED6;background:#EDF6F3;border-radius:14px;padding:18px 20px;display:flex;gap:14px;align-items:flex-start\">\n<span style=\"flex:none;width:24px;height:24px;border-radius:50%;background:#5E8B8B;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;margin-top:1px\">\u2713<\u002Fspan>\n<div>\n<div style=\"font-size:15px;margin-bottom:5px\">Registration received.<\u002Fdiv>\n<p style=\"margin:0;font-size:13.5px;line-height:1.55;color:#3A3F44\">A confirmation e-mail is on its way to the address you provided. Our team will contact you with the next steps once your registration has been reviewed.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<div style=\"padding:clamp(64px,9vw,120px) clamp(20px,4vw,56px) clamp(16px,2vw,24px)\">\n<div style=\"max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:clamp(16px,3vw,32px)\">\n<h2 style=\"margin:0;font-weight:300;font-size:clamp(30px,6vw,68px);letter-spacing:-.03em;color:#C4C7C9\">FACULTY<\u002Fh2>\n<span style=\"flex:1;height:1px;background:#DDDFE0\"><\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<section id=\"faculty-section\" data-screen-label=\"Faculty\" style=\"padding:clamp(28px,4vw,48px) clamp(20px,4vw,56px) clamp(56px,7vw,88px)\">\n<div style=\"max-width:1320px;margin:0 auto\">\n<div style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#5E8B8B;margin-bottom:16px\">01 &nbsp;Faculty &nbsp;\u00b7&nbsp; Our Faculty<\u002Fdiv>\n<p style=\"margin:0 0 clamp(32px,4vw,48px);font-weight:300;font-size:clamp(20px,2.6vw,30px);line-height:1.32;letter-spacing:-.02em;max-width:30ch;text-wrap:pretty\">All instruction is led by specialists active in clinical practice and research, with each faculty member overseeing a specific area of the curriculum.<\u002Fp>\n\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px\">\n<div style=\"border-radius:4px;overflow:hidden;background:#F7F7F7;transition:transform .45s,box-shadow .45s\" style-hover=\"transform:translateY(-6px);box-shadow:0 20px 44px rgba(20,23,26,.1)\">\n<div style=\"aspect-ratio:1/1;overflow:hidden;background:#EFEFEF\"><img src=\"fb8df443-3480-47e6-aabd-acdfdfeefed7\" alt=\"Prof. Dr. Gil Alcoforado\" style=\"width:100%;height:100%;object-fit:cover\"><\u002Fdiv>\n<div style=\"padding:clamp(20px,2.2vw,26px)\">\n<h4 style=\"margin:0;font-weight:400;font-size:20px;letter-spacing:-.01em\">Prof. Dr. Gil Alcoforado, DMD, PhD, FICD, FACD<\u002Fh4>\n<div style=\"font-size:14.5px;line-height:1.5;color:#3A3F44;margin:10px 0 7px\">Full Professor of Periodontology and Rector of Egas Moniz School of Health and Science<\u002Fdiv>\n<div style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#6E7479;margin:0 0 16px\">Almada, Portugal<\u002Fdiv>\n<p style=\"margin:0 0 18px;font-size:14px;line-height:1.6;color:#3A3F44\">Trained in Lisbon and Bergen; visiting researcher at the University of Pennsylvania and Visiting Professor at the University of Michigan. Co-founder and Past President of the EFP, President of the EAO (2024 \u2013 2026). Founder of the Portuguese Society of Periodontology and Implants. Lecturer in 23 countries. Recipient of the EFP Distinguished Service Award and the EAO Silver Award.<\u002Fp>\n<button type=\"button\" sc-camel-on-click=\"{{ toggleAlc }}\" style=\"background:none;border:0;padding:0;cursor:pointer;color:#5E8B8B;font-size:14.5px;display:inline-flex;align-items:center;gap:9px;border-bottom:1px solid #C4C7C9;padding-bottom:4px;transition:border-color .3s\" style-hover=\"border-color:#5E8B8B\">View CV <span>\u2192<\u002Fspan><\u002Fbutton>\n<sc-if value=\"{{ cvNarrowAlc }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-top:20px;border-top:1px solid #DDDFE0;padding-top:18px\">\n<div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding-bottom:14px;border-bottom:1px solid #DDDFE0\">\n<div>\n<h4 style=\"margin:0;font-weight:400;font-size:18px;letter-spacing:-.02em\">{{ cvName }}<\u002Fh4>\n<div style=\"font-size:14.5px;line-height:1.5;color:#3A3F44;margin-top:9px\">{{ cvFunc }}<\u002Fdiv>\n<div style=\"font:500 10.5px/1.6 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#6E7479;margin-top:7px\">{{ cvPlace }}<\u002Fdiv>\n<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{ closeCv }}\" style=\"flex:none;background:#DDE7E4;border:0;border-radius:999px;width:34px;height:34px;cursor:pointer;color:#5E8B8B;font-size:16px;transition:background .3s\" style-hover=\"background:#C4C7C9\">\u00d7<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;padding-top:18px\">\n<sc-for list=\"{{ cvBlocks }}\" as=\"block\" hint-placeholder-count=\"4\">\n<div>\n<div style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#5E8B8B;margin-bottom:16px\">{{ block.title }}<\u002Fdiv>\n<sc-for list=\"{{ block.rows }}\" as=\"row\" hint-placeholder-count=\"3\">\n<div style=\"display:grid;grid-template-columns:86px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid #DDDFE0;font-size:13.5px;line-height:1.55\">\n<span style=\"font:500 11px/1.5 'IBM Plex Mono',monospace;color:#9AA0A4\">{{ row.k }}<\u002Fspan>\n<span style=\"color:#3A3F44\">{{ row.v }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"border-radius:4px;overflow:hidden;background:#F7F7F7;transition:transform .45s,box-shadow .45s\" style-hover=\"transform:translateY(-6px);box-shadow:0 20px 44px rgba(20,23,26,.1)\">\n<div style=\"aspect-ratio:1/1;overflow:hidden;background:#EFEFEF\"><img src=\"aba87841-ee90-4c7a-a4a4-d7e35ee3520f\" alt=\"Dr. med. dent. Roland Glauser\" style=\"width:100%;height:100%;object-fit:cover\"><\u002Fdiv>\n<div style=\"padding:clamp(20px,2.2vw,26px)\">\n<h4 style=\"margin:0;font-weight:400;font-size:20px;letter-spacing:-.01em\">Dr. med. dent. Roland Glauser, DMD<\u002Fh4>\n<div style=\"font-size:14.5px;line-height:1.5;color:#3A3F44;margin:10px 0 7px\">Specialist in Oral Implantology<\u002Fdiv>\n<div style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#6E7479;margin:0 0 16px\">Z\u00fcrich, Switzerland<\u002Fdiv>\n<p style=\"margin:0 0 18px;font-size:14px;line-height:1.6;color:#3A3F44\">Z\u00fcrich-based specialist trained at the University of Z\u00fcrich. Assistant Professor and Academic 1997 \u2013 2006, then Clinical Director of the Z\u00fcrich Dental Center and private clinic. Clinical Associate Professor and Academic at Augusta University, USA (2006 \u2013 2020). Over 80 publications on tissue integration and shortened clinical protocols. Certified expert in oral implantology (EDA, FOR). Global keynote speaker and lecturer with awards from AO, AAO, AGO and TFAID.<\u002Fp>\n<button type=\"button\" sc-camel-on-click=\"{{ toggleGla }}\" style=\"background:none;border:0;padding:0;cursor:pointer;color:#5E8B8B;font-size:14.5px;display:inline-flex;align-items:center;gap:9px;border-bottom:1px solid #C4C7C9;padding-bottom:4px;transition:border-color .3s\" style-hover=\"border-color:#5E8B8B\">View CV <span>\u2192<\u002Fspan><\u002Fbutton>\n<sc-if value=\"{{ cvNarrowGla }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-top:20px;border-top:1px solid #DDDFE0;padding-top:18px\">\n<div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding-bottom:14px;border-bottom:1px solid #DDDFE0\">\n<div>\n<h4 style=\"margin:0;font-weight:400;font-size:18px;letter-spacing:-.02em\">{{ cvName }}<\u002Fh4>\n<div style=\"font-size:14.5px;line-height:1.5;color:#3A3F44;margin-top:9px\">{{ cvFunc }}<\u002Fdiv>\n<div style=\"font:500 10.5px/1.6 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#6E7479;margin-top:7px\">{{ cvPlace }}<\u002Fdiv>\n<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{ closeCv }}\" style=\"flex:none;background:#DDE7E4;border:0;border-radius:999px;width:34px;height:34px;cursor:pointer;color:#5E8B8B;font-size:16px;transition:background .3s\" style-hover=\"background:#C4C7C9\">\u00d7<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;padding-top:18px\">\n<sc-for list=\"{{ cvBlocks }}\" as=\"block\" hint-placeholder-count=\"4\">\n<div>\n<div style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#5E8B8B;margin-bottom:16px\">{{ block.title }}<\u002Fdiv>\n<sc-for list=\"{{ block.rows }}\" as=\"row\" hint-placeholder-count=\"3\">\n<div style=\"display:grid;grid-template-columns:86px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid #DDDFE0;font-size:13.5px;line-height:1.55\">\n<span style=\"font:500 11px/1.5 'IBM Plex Mono',monospace;color:#9AA0A4\">{{ row.k }}<\u002Fspan>\n<span style=\"color:#3A3F44\">{{ row.v }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"border-radius:4px;overflow:hidden;background:#F7F7F7;transition:transform .45s,box-shadow .45s\" style-hover=\"transform:translateY(-6px);box-shadow:0 20px 44px rgba(20,23,26,.1)\">\n<div style=\"aspect-ratio:1/1;overflow:hidden;background:#EFEFEF\"><img src=\"5d768465-cd50-4ab4-b2cb-c634e0caac44\" alt=\"Prof. Dr. Anton Sculean\" style=\"width:100%;height:100%;object-fit:cover\"><\u002Fdiv>\n<div style=\"padding:clamp(20px,2.2vw,26px)\">\n<h4 style=\"margin:0;font-weight:400;font-size:20px;letter-spacing:-.01em\">Prof. Dr. Anton Sculean, DMD, MS, PhD, Dr. h.c. mult.<\u002Fh4>\n<div style=\"font-size:14.5px;line-height:1.5;color:#3A3F44;margin:10px 0 7px\">Professor and Chair, Department of Periodontology, University of Bern<\u002Fdiv>\n<div style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#6E7479;margin:0 0 16px\">Bern, Switzerland<\u002Fdiv>\n<p style=\"margin:0 0 18px;font-size:14px;line-height:1.6;color:#3A3F44\">Trained in Budapest, M\u00fcnster, and Aarhus. Over 570 publications, 600+ invited lectures. Editor-in-Chief of Periodontology 2000. Past President of EFP, SSOI, and IAP. Recipient of the IADR Distinguished Scientist Award, EFP Eminence Award, and honorary doctorates from four European universities.<\u002Fp>\n<button type=\"button\" sc-camel-on-click=\"{{ toggleScu }}\" style=\"background:none;border:0;padding:0;cursor:pointer;color:#5E8B8B;font-size:14.5px;display:inline-flex;align-items:center;gap:9px;border-bottom:1px solid #C4C7C9;padding-bottom:4px;transition:border-color .3s\" style-hover=\"border-color:#5E8B8B\">View CV <span>\u2192<\u002Fspan><\u002Fbutton>\n<sc-if value=\"{{ cvNarrowScu }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-top:20px;border-top:1px solid #DDDFE0;padding-top:18px\">\n<div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding-bottom:14px;border-bottom:1px solid #DDDFE0\">\n<div>\n<h4 style=\"margin:0;font-weight:400;font-size:18px;letter-spacing:-.02em\">{{ cvName }}<\u002Fh4>\n<div style=\"font-size:14.5px;line-height:1.5;color:#3A3F44;margin-top:9px\">{{ cvFunc }}<\u002Fdiv>\n<div style=\"font:500 10.5px/1.6 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#6E7479;margin-top:7px\">{{ cvPlace }}<\u002Fdiv>\n<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{ closeCv }}\" style=\"flex:none;background:#DDE7E4;border:0;border-radius:999px;width:34px;height:34px;cursor:pointer;color:#5E8B8B;font-size:16px;transition:background .3s\" style-hover=\"background:#C4C7C9\">\u00d7<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;padding-top:18px\">\n<sc-for list=\"{{ cvBlocks }}\" as=\"block\" hint-placeholder-count=\"4\">\n<div>\n<div style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#5E8B8B;margin-bottom:16px\">{{ block.title }}<\u002Fdiv>\n<sc-for list=\"{{ block.rows }}\" as=\"row\" hint-placeholder-count=\"3\">\n<div style=\"display:grid;grid-template-columns:86px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid #DDDFE0;font-size:13.5px;line-height:1.55\">\n<span style=\"font:500 11px/1.5 'IBM Plex Mono',monospace;color:#9AA0A4\">{{ row.k }}<\u002Fspan>\n<span style=\"color:#3A3F44\">{{ row.v }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<sc-if value=\"{{ cvShowWide }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-top:22px;border:1px solid #C4C7C9;border-radius:22px;background:#fff;padding:clamp(22px,3vw,40px)\">\n<div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding-bottom:20px;border-bottom:1px solid #DDDFE0\">\n<div>\n<h4 style=\"margin:0;font-weight:400;font-size:clamp(20px,2.4vw,26px);letter-spacing:-.02em\">{{ cvName }}<\u002Fh4>\n<div style=\"font-size:14.5px;line-height:1.5;color:#3A3F44;margin-top:9px\">{{ cvFunc }}<\u002Fdiv>\n<div style=\"font:500 10.5px/1.6 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#6E7479;margin-top:7px\">{{ cvPlace }}<\u002Fdiv>\n<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{ closeCv }}\" style=\"flex:none;background:#DDE7E4;border:0;border-radius:999px;width:38px;height:38px;cursor:pointer;color:#5E8B8B;font-size:17px;transition:background .3s\" style-hover=\"background:#C4C7C9\">\u00d7<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(24px,3vw,44px);padding-top:26px\">\n<sc-for list=\"{{ cvBlocks }}\" as=\"block\" hint-placeholder-count=\"4\">\n<div>\n<div style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#5E8B8B;margin-bottom:16px\">{{ block.title }}<\u002Fdiv>\n<sc-for list=\"{{ block.rows }}\" as=\"row\" hint-placeholder-count=\"3\">\n<div style=\"display:grid;grid-template-columns:110px 1fr;gap:16px;padding:9px 0;border-bottom:1px solid #DDDFE0;font-size:14px;line-height:1.55\">\n<span style=\"font:500 11px/1.5 'IBM Plex Mono',monospace;color:#9AA0A4\">{{ row.k }}<\u002Fspan>\n<span style=\"color:#3A3F44\">{{ row.v }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"margin-top:clamp(28px,4vw,44px);border-radius:22px;background:#F7F7F7;border:1px solid #DDDFE0;color:#14171A;padding:clamp(26px,3.4vw,48px);display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(24px,3vw,48px);align-items:center\">\n<div>\n<h4 style=\"margin:0;font-weight:300;font-size:clamp(24px,3vw,36px);line-height:1.15;letter-spacing:-.025em\">Interested in joining our Faculty?<\u002Fh4>\n<p style=\"margin:18px 0 0;font-size:15px;line-height:1.62;color:#3A3F44;max-width:56ch\">Are you interested in becoming a member of our international Faculty team? Applications can be made to the Science and Education Board of the Institute for Oral Tissue Integrity. Please attach a current CV to your e-mail; we will get back to you with more details.<\u002Fp>\n<\u002Fdiv>\n<div style=\"justify-self:start\">\n<button type=\"button\" sc-camel-on-click=\"{{ toggleApply }}\" style=\"display:inline-flex;align-items:center;gap:10px;background:#5E8B8B;color:#fff;border:0;padding:16px 28px;border-radius:999px;font-size:15px;font-family:inherit;cursor:pointer;transition:background .3s,transform .3s\" style-hover=\"background:#4A7070;color:#fff;transform:translateY(-2px)\">{{ applyLabel }} <span>\u2192<\u002Fspan><\u002Fbutton>\n<\u002Fdiv>\n<sc-if value=\"{{ applyOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"grid-column:1/-1;background:#fff;border:1px solid #DDDFE0;border-radius:4px;padding:clamp(20px,2.4vw,30px);display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px\">\n<div style=\"grid-column:1/-1;font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:#5E8B8B\">Faculty application<\u002Fdiv>\n<label style=\"display:block\"><span style=\"display:block;font-size:12.5px;color:#6E7479;margin-bottom:6px\">Title / Academic credentials<\u002Fspan><input type=\"text\" style=\"width:100%;padding:12px 14px;border:1px solid #C4C7C9;border-radius:10px;background:#F7F7F7;outline:none;transition:border-color .25s\" style-focus=\"border-color:#5E8B8B\"><\u002Flabel>\n<label style=\"display:block\"><span style=\"display:block;font-size:12.5px;color:#6E7479;margin-bottom:6px\">First name<\u002Fspan><input type=\"text\" style=\"width:100%;padding:12px 14px;border:1px solid #C4C7C9;border-radius:10px;background:#F7F7F7;outline:none;transition:border-color .25s\" style-focus=\"border-color:#5E8B8B\"><\u002Flabel>\n<label style=\"display:block\"><span style=\"display:block;font-size:12.5px;color:#6E7479;margin-bottom:6px\">Last name<\u002Fspan><input type=\"text\" style=\"width:100%;padding:12px 14px;border:1px solid #C4C7C9;border-radius:10px;background:#F7F7F7;outline:none;transition:border-color .25s\" style-focus=\"border-color:#5E8B8B\"><\u002Flabel>\n<label style=\"display:block\"><span style=\"display:block;font-size:12.5px;color:#6E7479;margin-bottom:6px\">Current function<\u002Fspan><input type=\"text\" style=\"width:100%;padding:12px 14px;border:1px solid #C4C7C9;border-radius:10px;background:#F7F7F7;outline:none;transition:border-color .25s\" style-focus=\"border-color:#5E8B8B\"><\u002Flabel>\n<label style=\"display:block\"><span style=\"display:block;font-size:12.5px;color:#6E7479;margin-bottom:6px\">Institution / Practice<\u002Fspan><input type=\"text\" style=\"width:100%;padding:12px 14px;border:1px solid #C4C7C9;border-radius:10px;background:#F7F7F7;outline:none;transition:border-color .25s\" style-focus=\"border-color:#5E8B8B\"><\u002Flabel>\n<label style=\"display:block\"><span style=\"display:block;font-size:12.5px;color:#6E7479;margin-bottom:6px\">City<\u002Fspan><input type=\"text\" style=\"width:100%;padding:12px 14px;border:1px solid #C4C7C9;border-radius:10px;background:#F7F7F7;outline:none;transition:border-color .25s\" style-focus=\"border-color:#5E8B8B\"><\u002Flabel>\n<label style=\"display:block\"><span style=\"display:block;font-size:12.5px;color:#6E7479;margin-bottom:6px\">Country<\u002Fspan><input type=\"text\" style=\"width:100%;padding:12px 14px;border:1px solid #C4C7C9;border-radius:10px;background:#F7F7F7;outline:none;transition:border-color .25s\" style-focus=\"border-color:#5E8B8B\"><\u002Flabel>\n<label style=\"display:block\"><span style=\"display:block;font-size:12.5px;color:#6E7479;margin-bottom:6px\">E-mail address<\u002Fspan><input type=\"email\" style=\"width:100%;padding:12px 14px;border:1px solid #C4C7C9;border-radius:10px;background:#F7F7F7;outline:none;transition:border-color .25s\" style-focus=\"border-color:#5E8B8B\"><\u002Flabel>\n<label style=\"display:block;grid-column:1/-1\"><span style=\"display:block;font-size:12.5px;color:#6E7479;margin-bottom:6px\">Areas of clinical expertise and teaching interest<\u002Fspan><textarea rows=\"4\" style=\"width:100%;padding:12px 14px;border:1px solid #C4C7C9;border-radius:10px;background:#F7F7F7;outline:none;resize:vertical;transition:border-color .25s\" style-focus=\"border-color:#5E8B8B\"><\u002Ftextarea><\u002Flabel>\n<label style=\"display:block;grid-column:1/-1\"><span style=\"display:block;font-size:12.5px;color:#6E7479;margin-bottom:6px\">Current CV (PDF)<\u002Fspan><input type=\"file\" accept=\"application/pdf\" style=\"width:100%;padding:11px 14px;border:1px dashed #C4C7C9;border-radius:10px;background:#F7F7F7;font-size:14px\"><\u002Flabel>\n<label style=\"grid-column:1/-1;display:flex;gap:11px;align-items:flex-start;font-size:13px;line-height:1.55;color:#6E7479\"><input type=\"checkbox\" style=\"margin-top:3px;accent-color:#5E8B8B\">I consent to IOTI processing the information above for the purpose of assessing my application to the Faculty.<\u002Flabel>\n<button type=\"button\" sc-camel-on-click=\"{{ doApp }}\" style=\"grid-column:1/-1;background:#5E8B8B;color:#fff;border:0;border-radius:999px;padding:16px;font-size:15px;font-family:inherit;cursor:pointer;transition:background .3s\" style-hover=\"background:#4A7070\">Submit application \u2192<\u002Fbutton>\n<sc-if value=\"{{ appDone }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"grid-column:1/-1;margin-top:6px;border:1px solid #C7DED6;background:#EDF6F3;border-radius:14px;padding:18px 20px;display:flex;gap:14px;align-items:flex-start\">\n<span style=\"flex:none;width:24px;height:24px;border-radius:50%;background:#5E8B8B;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;margin-top:1px\">\u2713<\u002Fspan>\n<div>\n<div style=\"font-size:15px;margin-bottom:5px\">Application received.<\u002Fdiv>\n<p style=\"margin:0;font-size:13.5px;line-height:1.55;color:#3A3F44\">A confirmation e-mail is on its way to the address you provided. The Science and Education Board reviews applications on a rolling basis and will be in touch.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<sc-if value=\"{{ showResearch }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding:clamp(64px,9vw,120px) clamp(20px,4vw,56px) clamp(16px,2vw,24px)\">\n<div style=\"max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:clamp(16px,3vw,32px)\">\n<h2 style=\"margin:0;font-weight:300;font-size:clamp(30px,6vw,68px);letter-spacing:-.03em;color:#C4C7C9\">Research<\u002Fh2>\n<span style=\"flex:1;height:1px;background:#DDDFE0\"><\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<section id=\"studies\" data-screen-label=\"Research\" style=\"padding:clamp(28px,4vw,48px) clamp(20px,4vw,56px) clamp(56px,7vw,88px)\">\n<div style=\"max-width:1320px;margin:0 auto\">\n<div style=\"position:relative;overflow:hidden;border-radius:clamp(16px,2.4vw,26px);background:#F7F7F7;border:1px solid #DDDFE0;padding:clamp(28px,4vw,56px)\">\n<svg sc-camel-view-box=\"0 0 693 789\" aria-hidden=\"true\" style=\"position:absolute;right:-70px;top:-140px;width:min(400px,46vw);height:auto;opacity:.16;animation:drift 24s ease-in-out infinite;pointer-events:none\"><use href=\"#ioti-mark\"><\u002Fuse><\u002Fsvg>\n<div style=\"position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(28px,4vw,56px);align-items:start\">\n<div>\n<div style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#5E8B8B;margin-bottom:16px\">01 &nbsp;Research &nbsp;\u00b7&nbsp; Research support<\u002Fdiv>\n<h3 style=\"margin:0;font-weight:300;font-size:clamp(28px,4vw,48px);line-height:1.1;letter-spacing:-.028em\">Research Mini Grants available.<\u002Fh3>\n<p style=\"margin:22px 0 0;font-size:16px;line-height:1.65;color:#3A3F44;max-width:52ch\">The Institute for Oral Tissue Integrity offers Mini Research Grants to support observational studies, outcome registries, and collaborative trials <b style=\"font-weight:500\">investigating biological complications around dental restorations<\u002Fb>.<\u002Fp>\n<p style=\"margin:14px 0 0;font-size:16px;line-height:1.65;color:#3A3F44;max-width:52ch\"><b style=\"font-weight:500\">Grants can cover up to CHF 20,000<\u002Fb> of the expected cost per research proposal.<\u002Fp>\n<p style=\"margin:14px 0 0;font-size:16px;line-height:1.65;color:#3A3F44;max-width:52ch\">Grant proposals are reviewed twice a year by the Institute for Oral Tissue Integrity Science and Education Board.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#fff;border-radius:18px;padding:clamp(20px,2.4vw,30px)\">\n<div style=\"display:flex;justify-content:space-between;gap:16px;font-size:14.5px;padding:12px 0;border-bottom:1px solid #DDDFE0\"><span style=\"color:#6E7479\">Submission deadlines<\u002Fspan><span style=\"text-align:right\">June 30 and December 31<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:16px;font-size:14.5px;padding:12px 0;border-bottom:1px solid #DDDFE0\"><span style=\"color:#6E7479\">Review meetings<\u002Fspan><span style=\"text-align:right\">July / August and January / February respectively<\u002Fspan><\u002Fdiv>\n<p style=\"margin:16px 0 0;font-size:14px;line-height:1.6;color:#3A3F44\">Complete the Research Proposal Submission Form below and send it to <a href=\"mailto:research@oti.institute\" style=\"color:#5E8B8B\">research@oti.institute<\u002Fa>.<\u002Fp>\n<a href=\"#proposal\" style=\"display:block;text-align:center;margin-top:20px;background:#5E8B8B;color:#fff;text-decoration:none;padding:15px;border-radius:999px;font-size:15px;transition:background .3s\" style-hover=\"background:#4A7070;color:#fff\">Research Proposal Submission Form<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"margin-top:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;align-items:start\">\n<sc-if value=\"{{ showSupported }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"border:1px solid #DDDFE0;border-radius:20px;padding:clamp(22px,2.6vw,32px)\">\n<div style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:#5E8B8B;margin-bottom:18px\">Supported Research<\u002Fdiv>\n<p style=\"margin:0 0 16px;font-size:15.5px;line-height:1.6\">Findings from the first supported project have been published <span style=\"color:#6E7479\">(Brunello et al, 2022)<\u002Fspan>.<\u002Fp>\n<p style=\"margin:0;font-size:13.5px;line-height:1.6;color:#6E7479\">Brunello G, Rauch N, Becker K, Hakimi AR, Schwarz F, Becker J. Two-piece zirconia implants in the posterior mandible and maxilla: a cohort study with a follow-up period of 9 years. Clin Oral Implants Res. 2022;33(12):1233-1244. <a href=\"https://doi.org/10.1111/clr.14005\" style=\"color:#5E8B8B\">doi:10.1111/clr.14005<\u002Fa><\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n<div id=\"proposal\" style=\"border:1px solid #DDDFE0;border-radius:20px;padding:clamp(22px,2.6vw,32px);scroll-margin-top:100px\">\n<div style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:#5E8B8B;margin-bottom:18px\">Application<\u002Fdiv>\n<h4 style=\"margin:0 0 14px;font-weight:400;font-size:22px;letter-spacing:-.015em\">Research Proposal Submission Form<\u002Fh4>\n<p style=\"margin:0 0 22px;font-size:14.5px;line-height:1.6;color:#3A3F44\">Download the fillable PDF form, complete all sections on your computer and e-mail it to <a href=\"mailto:research@oti.institute\" style=\"color:#5E8B8B\">research@oti.institute<\u002Fa>. Guidance notes are included in the form.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px\">\n<sc-for list=\"{{ proposalSections }}\" as=\"s\" hint-placeholder-count=\"10\">\n<span style=\"display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:#F7F7F7;font-size:12.5px;color:#3A3F44\"><span style=\"font:500 10px/1 'IBM Plex Mono',monospace;color:#5E8B8B\">{{ s.n }}<\u002Fspan>{{ s.t }}<\u002Fspan>\n<\u002Fsc-for>\n<\u002Fdiv>\n<a href=\"data:application/pdf;base64,JVBERi0xLjQKJZOMi54gUmVwb3J0TGFiIEdlbmVyYXRlZCBQREYgZG9jdW1lbnQgKG9wZW5zb3VyY2UpCjEgMCBvYmoKPDwKL0YxIDIgMCBSIC9GMiA1IDAgUiAvRjMgMzQgMCBSCj4+CmVuZG9iagoyIDAgb2JqCjw8Ci9CYXNlRm9udCAvSGVsdmV0aWNhIC9FbmNvZGluZyAvV2luQW5zaUVuY29kaW5nIC9OYW1lIC9GMSAvU3VidHlwZSAvVHlwZTEgL1R5cGUgL0ZvbnQKPj4KZW5kb2JqCjMgMCBvYmoKPDwKL0Jpd
