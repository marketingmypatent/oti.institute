vfrag=\"0\" style=\"opacity:0;transform:translateY(20px);transition:opacity .7s cubic-bezier(.22,.7,.3,1),transform .7s cubic-bezier(.22,.7,.3,1)\">\n<span style=\"font-weight:300;font-size:clamp(22px,3.3vw,46px);line-height:1.12;letter-spacing:-.03em;text-wrap:pretty\">A world where biological complications<\u002Fspan>\n<\u002Fdiv>\n<div data-vfrag=\"1\" style=\"opacity:0;transform:translateY(20px);transition:opacity .7s cubic-bezier(.22,.7,.3,1),transform .7s cubic-bezier(.22,.7,.3,1)\">\n<span style=\"font-weight:300;font-size:clamp(22px,3.3vw,46px);line-height:1.12;letter-spacing:-.03em;text-wrap:pretty\">around dental restorations<\u002Fspan>\n<\u002Fdiv>\n<div data-vfrag=\"2\" style=\"opacity:0;transform:translateY(20px);transition:opacity .7s cubic-bezier(.22,.7,.3,1),transform .7s cubic-bezier(.22,.7,.3,1)\">\n<span style=\"font-weight:300;font-size:clamp(22px,3.3vw,46px);line-height:1.12;letter-spacing:-.03em;text-wrap:pretty\">no longer occur,<\u002Fspan>\n<\u002Fdiv>\n<div data-vfrag=\"3\" style=\"opacity:0;transform:translateY(20px);transition:opacity .7s cubic-bezier(.22,.7,.3,1),transform .7s cubic-bezier(.22,.7,.3,1)\">\n<span style=\"font-weight:300;font-size:clamp(22px,3.3vw,46px);line-height:1.12;letter-spacing:-.03em;text-wrap:pretty\">because the specialists treating them<\u002Fspan>\n<\u002Fdiv>\n<div data-vfrag=\"4\" style=\"opacity:0;transform:translateY(20px);transition:opacity .7s cubic-bezier(.22,.7,.3,1),transform .7s cubic-bezier(.22,.7,.3,1)\">\n<span style=\"font-weight:300;font-size:clamp(22px,3.3vw,46px);line-height:1.12;letter-spacing:-.03em;text-wrap:pretty\">were educated to prevent and eliminate them.<\u002Fspan>\n<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div id=\"mission\" data-screen-label=\"Mission\" style=\"scroll-margin-top:100px;margin-top:clamp(52px,7vw,104px);padding-top:clamp(32px,4vw,56px);border-top:1px solid rgba(20,23,26,.14);display:grid;grid-template-columns:1fr;gap:clamp(20px,2.6vw,32px);align-items:start\">\n<div>\n<div style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#5E8B8B;margin-bottom:22px\">01 &nbsp;About &nbsp;\u00b7&nbsp; Our Mission<\u002Fdiv>\n<p style=\"margin:0;font-weight:300;font-size:clamp(21px,2.7vw,32px);line-height:1.28;letter-spacing:-.022em;text-wrap:pretty\">We educate oral medicine specialists to the level of competency required to eliminate biological complications around artificial dental restorations.<\u002Fp>\n<\u002Fdiv>\n<p style=\"margin:0;font-size:16px;line-height:1.72;color:#3A3F44;max-width:68ch\">Our educational programs and activities are built on evidence, structured around competencies and clinical skill development, and evaluated by the improved outcomes achieved for patients.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"values\" data-screen-label=\"Values\" style=\"padding:clamp(64px,8vw,104px) clamp(20px,4vw,56px)\">\n<div style=\"max-width:1320px;margin:0 auto\">\n<div style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#5E8B8B;margin-bottom:16px\">02 &nbsp;About &nbsp;\u00b7&nbsp; Our Values<\u002Fdiv>\n<h3 style=\"margin:0 0 clamp(28px,3.6vw,48px);font-weight:300;font-size:clamp(28px,4vw,48px);line-height:1.1;letter-spacing:-.028em;max-width:22ch;text-wrap:pretty\">Five values guide what we teach, how we teach it, and who it is for.<\u002Fh3>\n\n<div sc-camel-on-mouse-enter=\"{{ vOn1 }}\" sc-camel-on-mouse-leave=\"{{ vOff }}\" style=\"border-top:1px solid #DDDFE0;padding:clamp(20px,2.4vw,30px) clamp(0px,1.5vw,18px);transition:background .4s\" style-hover=\"background:#F7F7F7\">\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(14px,3vw,44px);align-items:baseline\">\n<div style=\"flex:none;width:clamp(46px,5vw,88px);font-weight:200;font-size:clamp(30px,4vw,54px);line-height:.85;color:#C4C7C9\">01<\u002Fdiv>\n<h4 style=\"flex:1 1 200px;margin:0;font-weight:400;font-size:clamp(19px,2.2vw,25px);line-height:1.2;letter-spacing:-.018em\">Patient outcomes first<\u002Fh4>\n<\u002Fdiv>\n<div style=\"overflow:hidden;transition:max-height .55s cubic-bezier(.22,.7,.3,1),opacity .4s ease;max-height:{{ v1h }};opacity:{{ v1o }}\">\n<div style=\"padding-top:clamp(12px,1.4vw,18px);padding-left:calc(clamp(46px,5vw,88px) + clamp(14px,3vw,44px));display:grid;gap:11px;max-width:78ch\">\n<p style=\"margin:0;font-size:15px;line-height:1.62;color:#3A3F44\">Every curriculum decision, every assessment, and every program review starts with one question: Does this make specialists more competent at achieving better outcomes for their patients?<\u002Fp>\n<p style=\"margin:0;font-size:15px;line-height:1.62;color:#6E7479\">If it does not, it does not belong in our programs.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div sc-camel-on-mouse-enter=\"{{ vOn2 }}\" sc-camel-on-mouse-leave=\"{{ vOff }}\" style=\"border-top:1px solid #DDDFE0;padding:clamp(20px,2.4vw,30px) clamp(0px,1.5vw,18px);transition:background .4s\" style-hover=\"background:#F7F7F7\">\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(14px,3vw,44px);align-items:baseline\">\n<div style=\"flex:none;width:clamp(46px,5vw,88px);font-weight:200;font-size:clamp(30px,4vw,54px);line-height:.85;color:#C4C7C9\">02<\u002Fdiv>\n<h4 style=\"flex:1 1 200px;margin:0;font-weight:400;font-size:clamp(19px,2.2vw,25px);line-height:1.2;letter-spacing:-.018em\">Clinical honesty<\u002Fh4>\n<\u002Fdiv>\n<div style=\"overflow:hidden;transition:max-height .55s cubic-bezier(.22,.7,.3,1),opacity .4s ease;max-height:{{ v2h }};opacity:{{ v2o }}\">\n<div style=\"padding-top:clamp(12px,1.4vw,18px);padding-left:calc(clamp(46px,5vw,88px) + clamp(14px,3vw,44px));display:grid;gap:11px;max-width:78ch\">\n<p style=\"margin:0;font-size:15px;line-height:1.62;color:#3A3F44\">We teach what evidence supports. Where evidence is limited or missing, we say so and reach out for multiple expert opinions.<\u002Fp>\n<p style=\"margin:0;font-size:15px;line-height:1.62;color:#6E7479\">We do not present opinion as fact, and we do not avoid difficult clinical realities in the classroom.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div sc-camel-on-mouse-enter=\"{{ vOn3 }}\" sc-camel-on-mouse-leave=\"{{ vOff }}\" style=\"border-top:1px solid #DDDFE0;padding:clamp(20px,2.4vw,30px) clamp(0px,1.5vw,18px);transition:background .4s\" style-hover=\"background:#F7F7F7\">\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(14px,3vw,44px);align-items:baseline\">\n<div style=\"flex:none;width:clamp(46px,5vw,88px);font-weight:200;font-size:clamp(30px,4vw,54px);line-height:.85;color:#C4C7C9\">03<\u002Fdiv>\n<h4 style=\"flex:1 1 200px;margin:0;font-weight:400;font-size:clamp(19px,2.2vw,25px);line-height:1.2;letter-spacing:-.018em\">Respect for the specialist<\u002Fh4>\n<\u002Fdiv>\n<div style=\"overflow:hidden;transition:max-height .55s cubic-bezier(.22,.7,.3,1),opacity .4s ease;max-height:{{ v3h }};opacity:{{ v3o }}\">\n<div style=\"padding-top:clamp(12px,1.4vw,18px);padding-left:calc(clamp(46px,5vw,88px) + clamp(14px,3vw,44px));display:grid;gap:11px;max-width:78ch\">\n<p style=\"margin:0;font-size:15px;line-height:1.62;color:#3A3F44\">Our learners are qualified professionals.<\u002Fp>\n<p style=\"margin:0;font-size:15px;line-height:1.62;color:#6E7479\">We treat them accordingly: with high expectations, honest feedback, and the academic and clinical resources they need to meet those expectations.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div sc-camel-on-mouse-enter=\"{{ vOn4 }}\" sc-camel-on-mouse-leave=\"{{ vOff }}\" style=\"border-top:1px solid #DDDFE0;padding:clamp(20px,2.4vw,30px) clamp(0px,1.5vw,18px);transition:background .4s\" style-hover=\"background:#F7F7F7\">\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(14px,3vw,44px);align-items:baseline\">\n<div style=\"flex:none;width:clamp(46px,5vw,88px);font-weight:200;font-size:clamp(30px,4vw,54px);line-height:.85;color:#C4C7C9\">04<\u002Fdiv>\n<h4 style=\"flex:1 1 200px;margin:0;font-weight:400;font-size:clamp(19px,2.2vw,25px);line-height:1.2;letter-spacing:-.018em\">Continuous improvement<\u002Fh4>\n<\u002Fdiv>\n<div style=\"overflow:hidden;transition:max-height .55s cubic-bezier(.22,.7,.3,1),opacity .4s ease;max-height:{{ v4h }};opacity:{{ v4o }}\">\n<div style=\"padding-top:clamp(12px,1.4vw,18px);padding-left:calc(clamp(46px,5vw,88px) + clamp(14px,3vw,44px));display:grid;gap:11px;max-width:78ch\">\n<p style=\"margin:0;font-size:15px;line-height:1.62;color:#3A3F44\">Our programs are revised when evidence changes, when patient outcomes data requires it, or when clinical practice moves forward.<\u002Fp>\n<p style=\"margin:0;font-size:15px;line-height:1.62;color:#6E7479\">We do not preserve curriculum for its own sake.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div sc-camel-on-mouse-enter=\"{{ vOn5 }}\" sc-camel-on-mouse-leave=\"{{ vOff }}\" style=\"border-top:1px solid #DDDFE0;border-bottom:1px solid #DDDFE0;padding:clamp(20px,2.4vw,30px) clamp(0px,1.5vw,18px);transition:background .4s\" style-hover=\"background:#F7F7F7\">\n<div style=\"display:flex;flex-wrap:wrap;gap:clamp(14px,3vw,44px);align-items:baseline\">\n<div style=\"flex:none;width:clamp(46px,5vw,88px);font-weight:200;font-size:clamp(30px,4vw,54px);line-height:.85;color:#C4C7C9\">05<\u002Fdiv>\n<h4 style=\"flex:1 1 200px;margin:0;font-weight:400;font-size:clamp(19px,2.2vw,25px);line-height:1.2;letter-spacing:-.018em\">Global accessibility<\u002Fh4>\n<\u002Fdiv>\n<div style=\"overflow:hidden;transition:max-height .55s cubic-bezier(.22,.7,.3,1),opacity .4s ease;max-height:{{ v5h }};opacity:{{ v5o }}\">\n<div style=\"padding-top:clamp(12px,1.4vw,18px);padding-left:calc(clamp(46px,5vw,88px) + clamp(14px,3vw,44px));display:grid;gap:11px;max-width:78ch\">\n<p style=\"margin:0;font-size:15px;line-height:1.62;color:#3A3F44\">Biological complications around dental restorations affect patients everywhere.<\u002Fp>\n<p style=\"margin:0;font-size:15px;line-height:1.62;color:#6E7479\">Our education is accessible to qualified specialists regardless of geography, and our standards are set for a global profession, not a single market.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"organisation\" data-screen-label=\"Organisation\" style=\"background:#F7F7F7;padding:clamp(64px,8vw,104px) clamp(20px,4vw,56px)\">\n<div style=\"max-width:1320px;margin:0 auto\">\n<div style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#5E8B8B;margin-bottom:16px\">03 &nbsp;About &nbsp;\u00b7&nbsp; Organisation<\u002Fdiv>\n<h3 style=\"margin:0 0 18px;font-weight:300;font-size:clamp(28px,4vw,48px);line-height:1.1;letter-spacing:-.028em\">Who runs the Institute.<\u002Fh3>\n<p style=\"margin:0 0 clamp(30px,4vw,44px);font-size:16px;line-height:1.65;color:#3A3F44;max-width:56ch\">The Institute for Oral Tissue Integrity is advised by an independent Science and Education Board.<\u002Fp>\n\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(20px,3vw,40px);align-items:start\">\n<div>\n<h4 style=\"margin:0 0 8px;font-weight:400;font-size:21px;letter-spacing:-.015em\">Science and Education Board<\u002Fh4>\n<p style=\"margin:0 0 22px;font-size:14.5px;line-height:1.6;color:#6E7479\">An independent advisory body of clinicians and researchers.<\u002Fp>\n<div style=\"position:relative;border:1px solid #DDDFE0;border-radius:18px;overflow:hidden\">\n<div style=\"position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#5E8B8B 0%,#7AA3A3 100%)\"><\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{ orgScu }}\" style=\"width:100%;text-align:left;font:inherit;background:none;border:0;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:18px 22px 18px 26px;border-bottom:1px solid #DDDFE0;cursor:pointer;color:#14171A;transition:background .3s\" style-hover=\"background:#F7F7F7;color:#14171A\">\n<span style=\"flex:none;width:9px;height:9px;border-radius:50%;background:#5E8B8B\"><\u002Fspan>\n<span><span style=\"display:block;font-size:16px\">Prof. Dr. Anton Sculean, DMD, MS, PhD, Dr. h.c. mult.<\u002Fspan><span style=\"display:block;font:500 10.5px/1.7 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#6E7479\">Board Member \u00b7 Switzerland<\u002Fspan><\u002Fspan>\n<span style=\"color:#5E8B8B;font-size:14px\">View CV \u203a<\u002Fspan>\n<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ orgAlc }}\" style=\"width:100%;text-align:left;font:inherit;background:none;border:0;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:18px 22px 18px 26px;border-bottom:1px solid #DDDFE0;cursor:pointer;color:#14171A;transition:background .3s\" style-hover=\"background:#F7F7F7;color:#14171A\">\n<span style=\"flex:none;width:9px;height:9px;border-radius:50%;background:#5E8B8B\"><\u002Fspan>\n<span><span style=\"display:block;font-size:16px\">Prof. Dr. Gil Alcoforado, DMD, PhD, FICD, FACD<\u002Fspan><span style=\"display:block;font:500 10.5px/1.7 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#6E7479\">Board Member \u00b7 Portugal<\u002Fspan><\u002Fspan>\n<span style=\"color:#5E8B8B;font-size:14px\">View CV \u203a<\u002Fspan>\n<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ orgGla }}\" style=\"width:100%;text-align:left;font:inherit;background:none;border:0;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:18px 22px 18px 26px;border-bottom:1px solid #DDDFE0;cursor:pointer;color:#14171A;transition:background .3s\" style-hover=\"background:#F7F7F7;color:#14171A\">\n<span style=\"flex:none;width:9px;height:9px;border-radius:50%;background:#5E8B8B\"><\u002Fspan>\n<span><span style=\"display:block;font-size:16px\">Dr. med. dent. Roland Glauser, DMD<\u002Fspan><span style=\"display:block;font:500 10.5px/1.7 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#6E7479\">Board Member \u00b7 Switzerland<\u002Fspan><\u002Fspan>\n<span style=\"color:#5E8B8B;font-size:14px\">View CV \u203a<\u002Fspan>\n<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ toggleRue }}\" style=\"width:100%;text-align:left;background:none;border:0;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:18px 22px 18px 26px;cursor:pointer;transition:background .3s;font:inherit\" style-hover=\"background:#F7F7F7\">\n<span style=\"flex:none;width:9px;height:9px;border-radius:50%;background:#5E8B8B\"><\u002Fspan>\n<span><span style=\"display:block;font-size:16px\">Urs R\u00fcetschi<\u002Fspan><span style=\"display:block;font:500 10.5px/1.7 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#6E7479\">Board Member / Institute Director \u00b7 Switzerland<\u002Fspan><\u002Fspan>\n<span style=\"color:#5E8B8B;font-size:14px\">View CV \u203a<\u002Fspan>\n<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{ showMgmt }}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n<h4 style=\"margin:0 0 8px;font-weight:400;font-size:21px;letter-spacing:-.015em\">Institute Management<\u002Fh4>\n<p style=\"margin:0 0 22px;font-size:14.5px;line-height:1.6;color:#6E7479\">The team responsible for day-to-day operations and program delivery.<\u002Fp>\n<div style=\"border-radius:18px;overflow:hidden;background:#F7F7F7;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;padding:20px\">\n<img src=\"b52b2ff3-289a-457d-b106-3f5a8f9b820e\" alt=\"Urs R\u00fcetschi\" style=\"width:96px;height:120px;object-fit:cover;border-radius:12px\">\n<div>\n<div style=\"font-size:17px\">Urs R\u00fcetschi<\u002Fdiv>\n<div style=\"font:500 10.5px/1.7 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#6E7479\">Institute Director<\u002Fdiv>\n<div style=\"font:500 10.5px/1.7 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#6E7479\">R\u00fcschlikon, Switzerland<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n\n<sc-if value=\"{{ cvShowOrg }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-top:22px;border:1px solid #C4C7C9;border-radius:4px;background:#fff;padding:clamp(22px,3vw,40px)\">\n<div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding-bottom:20px;border-bottom:1px solid #DDDFE0\">\n<div>\n<h4 style=\"margin:0;font-weight:400;font-size:clamp(20px,2.4vw,26px);letter-spacing:-.02em\">{{ cvName }}<\u002Fh4>\n<div style=\"font-size:14.5px;line-height:1.5;color:#3A3F44;margin-top:9px\">{{ cvFunc }}<\u002Fdiv>\n<div style=\"font:500 10.5px/1.6 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#6E7479;margin-top:7px\">{{ cvPlace }}<\u002Fdiv>\n<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{ closeCv }}\" style=\"flex:none;background:#DDE7E4;border:0;border-radius:999px;width:38px;height:38px;cursor:pointer;color:#5E8B8B;font-size:17px;transition:background .3s\" style-hover=\"background:#C4C7C9\">\u00d7<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(24px,3vw,44px);padding-top:26px\">\n<sc-for list=\"{{ cvBlocks }}\" as=\"block\" hint-placeholder-count=\"4\">\n<div>\n<div style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#5E8B8B;margin-bottom:16px\">{{ block.title }}<\u002Fdiv>\n<sc-for list=\"{{ block.rows }}\" as=\"row\" hint-placeholder-count=\"3\">\n<div style=\"display:grid;grid-template-columns:110px 1fr;gap:16px;padding:9px 0;border-bottom:1px solid #DDDFE0;font-size:14px;line-height:1.55\">\n<span style=\"font:500 11px/1.5 'IBM Plex Mono',monospace;color:#9AA0A4\">{{ row.k }}<\u002Fspan>\n<span style=\"color:#3A3F44\">{{ row.v }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ rueOpen }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-top:22px;border:1px solid #C4C7C9;border-radius:22px;background:#fff;padding:clamp(22px,3vw,40px)\">\n<div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding-bottom:20px;border-bottom:1px solid #DDDFE0\">\n<div>\n<h4 style=\"margin:0;font-weight:400;font-size:clamp(20px,2.4vw,26px);letter-spacing:-.02em\">Urs R\u00fcetschi<\u002Fh4>\n<div style=\"font:500 10.5px/1.6 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#6E7479;margin-top:8px\">Board Member / Institute Director \u00b7 R\u00fcschlikon, Switzerland<\u002Fdiv>\n<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{ closeRue }}\" style=\"flex:none;background:#DDE7E4;border:0;border-radius:999px;width:38px;height:38px;cursor:pointer;color:#5E8B8B;font-size:17px;transition:background .3s\" style-hover=\"background:#C4C7C9\">\u00d7<\u002Fbutton>\n<\u002Fdiv>\n<p style=\"margin:24px 0 0;font-size:15px;line-height:1.65;color:#3A3F44;max-width:80ch\">Swiss medical education executive with over 20 years at the AO Foundation, where he built and led the AO Education Institute into a globally recognized center for postgraduate surgical education. Earlier career in publishing, digital media, and strategic marketing. Peer-reviewed publications on CME trends, faculty development, and educational assessment. Member of the Johnson &amp; Johnson Institute Global Education Council (2018\u20132021) and AMEE Program Committee. Institute Director of the Institute for Oral Tissue Integrity (IOTI).<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(24px,3vw,44px);padding-top:28px\">\n<sc-for list=\"{{ rueBlocks }}\" as=\"block\" hint-placeholder-count=\"3\">\n<div>\n<div style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#5E8B8B;margin-bottom:16px\">{{ block.title }}<\u002Fdiv>\n<sc-for list=\"{{ block.rows }}\" as=\"row\" hint-placeholder-count=\"3\">\n<div style=\"display:grid;grid-template-columns:110px 1fr;gap:16px;padding:9px 0;border-bottom:1px solid #DDDFE0;font-size:14px;line-height:1.55\">\n<span style=\"font:500 11px/1.5 'IBM Plex Mono',monospace;color:#9AA0A4\">{{ row.k }}<\u002Fspan>\n<span style=\"color:#3A3F44\">{{ row.v }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"legal\" data-screen-label=\"Legal Framework\" style=\"padding:clamp(64px,8vw,104px) clamp(20px,4vw,56px)\">\n<div style=\"max-width:1320px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(28px,4vw,56px);align-items:start\">\n<div>\n<div style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#5E8B8B;margin-bottom:16px\">04 &nbsp;About &nbsp;\u00b7&nbsp; Legal Framework<\u002Fdiv>\n<h3 style=\"margin:0 0 22px;font-weight:300;font-size:clamp(28px,4vw,48px);line-height:1.1;letter-spacing:-.028em\">How the Institute is constituted.<\u002Fh3>\n<p style=\"margin:0;font-size:16px;line-height:1.7;color:#3A3F44;max-width:56ch\">The Institute for Oral Tissue Integrity is organized as an independent non-profit institute under Swiss law, registered in the canton of Z\u00fcrich. Educational programs are operated under the oversight of the Science and Education Board.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#fff;border-radius:20px;padding:clamp(20px,2.4vw,30px)\">\n<div style=\"display:flex;justify-content:space-between;gap:16px;font-size:15px;padding:14px 0;border-bottom:1px solid #DDDFE0\"><span style=\"color:#6E7479\">Legal form<\u002Fspan><span>Verein / Association<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:16px;font-size:15px;padding:14px 0;border-bottom:1px solid #DDDFE0\"><span style=\"color:#6E7479\">Jurisdiction<\u002Fspan><span>Canton of Z\u00fcrich, CH<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:16px;font-size:15px;padding:14px 0;border-bottom:1px solid #DDDFE0\"><span style=\"color:#6E7479\">Registry<\u002Fspan><span>To be issued<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:16px;font-size:15px;padding:14px 0\"><span style=\"color:#6E7479\">Tax status<\u002Fspan><span>Non-profit<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"funding\" data-screen-label=\"Funding\" style=\"background:#F7F7F7;padding:clamp(64px,8vw,104px) clamp(20px,4vw,56px)\">\n<div style=\"max-width:1320px;margin:0 auto\">\n<div style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#5E8B8B;margin-bottom:16px\">05 &nbsp;About &nbsp;\u00b7&nbsp; Funding<\u002Fdiv>\n<h3 style=\"margin:0 0 clamp(28px,3.4vw,42px);font-weight:300;font-size:clamp(28px,4vw,48px);line-height:1.1;letter-spacing:-.028em\">How the Institute is financed.<\u002Fh3>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:clamp(20px,2.6vw,36px)\">\n<p style=\"margin:0;font-size:16px;line-height:1.7;color:#3A3F44\">Our activities are made possible through a combination of unrestricted support agreements and income from our own educational activities.<\u002Fp>\n<p style=\"margin:0;font-size:16px;line-height:1.7;color:#3A3F44\">We can receive grants, project funding, and in-kind contributions from industry partners through dedicated Support Agreements.<\u002Fp>\n<p style=\"margin:0;font-size:16px;line-height:1.7;color:#3A3F44\">These Agreements are strictly unrestricted: funders have no influence over our educational or research content. All editorial, educational, and scientific decisions remain solely with the Institute.<\u002Fp>\n<p style=\"margin:0;font-size:16px;line-height:1.7;color:#3A3F44\">In addition, we generate income through our own educational activities, which further supports our independence and mission.<\u002Fp>\n<\u002Fdiv>\n<div style=\"margin-top:clamp(28px,3.4vw,42px);border:1px solid #DDDFE0;border-radius:20px;padding:clamp(22px,2.6vw,32px);display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between\">\n<span style=\"font-size:15.5px;color:#6E7479\">The Institute currently holds Support Agreements with<\u002Fspan>\n<span style=\"font-size:clamp(18px,2.2vw,26px);font-weight:300;letter-spacing:-.02em\">Patent Medical AG, Altendorf <span style=\"color:#6E7479;font-size:15px\">(Switzerland)<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<sc-if value=\"{{ showMedia }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"background:#F7F7F7;padding:clamp(64px,9vw,120px) clamp(20px,4vw,56px) clamp(16px,2vw,24px)\">\n<div style=\"max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:clamp(16px,3vw,32px)\">\n<h2 style=\"margin:0;font-weight:300;font-size:clamp(30px,6vw,68px);letter-spacing:-.03em;color:#C4C7C9;text-transform:none\">NEWS &amp; MEDIA<\u002Fh2>\n<span style=\"flex:1;height:1px;background:#DDDFE0\"><\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<section id=\"media\" data-screen-label=\"News &amp; Media\" style=\"background:#F7F7F7;padding:clamp(40px,5vw,64px) clamp(20px,4vw,56px) clamp(64px,8vw,104px)\">\n<div style=\"max-width:1320px;margin:0 auto\">\n<div style=\"font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:#5E8B8B;margin-bottom:16px\">01 &nbsp;News &amp; Media &nbsp;\u00b7&nbsp; News<\u002Fdiv>\n<h3 style=\"margin:0 0 clamp(28px,3.4vw,42px);font-weight:300;font-size:clamp(28px,4vw,48px);line-height:1.1;letter-spacing:-.028em;max-width:22ch\">News from the Institute and material for journalists.<\u002Fh3>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:20px;align-items:stretch\">\n<div style=\"background:#fff;border-radius:20px;padding:clamp(20px,2.4vw,30px)\">\n<div style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#5E8B8B;margin-bottom:16px\">News<\u002Fdiv>\n<div style=\"padding:14px 0;border-bottom:1px solid #DDDFE0\">\n<div style=\"font:500 11px/1.5 'IBM Plex Mono',monospace;color:#9AA0A4\">[Launch date]<\u002Fdiv>\n<div style=\"font-size:17px;line-height:1.45;margin:6px 0 14px\">The Institute for Oral Tissue Integrity starts operations<\u002Fdiv>\n<div style=\"display:flex;gap:8px;flex-wrap:wrap\"><a href=\"#media\" style=\"display:inline-flex;align-items:center;gap:10px;background:transparent;border:1px solid #C4C7C9;color:#14171A;text-decoration:none;padding:11px 20px;border-radius:999px;font-size:14px;transition:border-color .3s\" style-hover=\"border-color:#5E8B8B;color:#14171A\">English <span>\u2193<\u002Fspan><\u002Fa><a href=\"#media\" style=\"display:inline-flex;align-items:center;gap:10px;background:transparent;border:1px solid #C4C7C9;color:#14171A;text-decoration:none;padding:11px 20px;border-radius:999px;font-size:14px;transition:border-color .3s\" style-hover=\"border-color:#5E8B8B;color:#14171A\">Deutsch <span>\u2193<\u002Fspan><\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:16px 0 0;font-size:14px;line-height:1.6;color:#6E7479\">Further announcements are published here and sent to our mailing list.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#fff;border-radius:20px;padding:clamp(20px,2.4vw,30px)\">\n<div style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#5E8B8B;margin-bottom:16px\">Fact sheet<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:16px;font-size:15px;padding:14px 0;border-bottom:1px solid #DDDFE0\"><span style=\"color:#6E7479\">Name<\u002Fspan><span style=\"text-align:right\">Institute for Oral Tissue Integrity (IOTI)<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:16px;font-size:15px;padding:14px 0;border-bottom:1px solid #DDDFE0\"><span style=\"color:#6E7479\">Purpose<\u002Fspan><span style=\"text-align:right;max-width:30ch\">Research and education for oral medicine specialists<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:16px;font-size:15px;padding:14px 0;border-bottom:1px solid #DDDFE0\"><span style=\"color:#6E7479\">Legal form<\u002Fspan><span>Verein / Association, non-profit<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:16px;font-size:15px;padding:14px 0;border-bottom:1px solid #DDDFE0\"><span style=\"color:#6E7479\">Seat<\u002Fspan><span>R\u00fcschlikon, Switzerland<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:16px;font-size:15px;padding:14px 0;border-bottom:1px solid #DDDFE0\"><span style=\"color:#6E7479\">Science and Education Board<\u002Fspan><span style=\"text-align:right\">4 members<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:16px;font-size:15px;padding:14px 0;border-bottom:1px solid #DDDFE0\"><span style=\"color:#6E7479\">Institute Director<\u002Fspan><span>Urs R\u00fcetschi<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;gap:16px;font-size:15px;padding:14px 0\"><span style=\"color:#6E7479\">Funding<\u002Fspan><span style=\"text-align:right;max-width:30ch\">Unrestricted Support Agreements and own educational income<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#fff;border-radius:20px;padding:clamp(20px,2.4vw,30px)\">\n<div style=\"font:500 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#5E8B8B;margin-bottom:16px\">Media kit<\u002Fdiv>\n<p style=\"margin:0 0 18px;font-size:15px;line-height:1.65;color:#3A3F44\">Logo files and portraits of the Science and Education Board and the Institute Director for editorial coverage of the Institute.<\u002Fp>\n<div style=\"display:flex;
